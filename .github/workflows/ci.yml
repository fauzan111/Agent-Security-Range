name: agentsec-ci

# Agent safety as a regression gate: on every push and PR, run the test suite and then the
# acceptance gate. verify-gate re-runs all ten ASI attacks and fails the build (exit 1) if
# any change quietly re-opens an attack or breaks a mitigation mapping.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (editable, with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests
        run: pytest -q

      - name: Acceptance gate (every mitigation vs its attack)
        run: agentsec verify-gate
